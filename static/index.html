<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Desk</title>
<style>
:root{
  --bg:#f6f5f0; --surface:#ffffff; --soft:#eef3ef; --line:#e3e8e2; --line2:#d3dcd5;
  --ink:#243b3a; --mute:#6a7f7c; --faint:#93a39f;
  --teal:#2a7f77; --teal-d:#1f645d; --teal-l:#dcebe8;
  --sand:#e9c46a; --sand-l:#f8efd4; --sand-d:#8a6a1f;
  --ok:#4a9d7a; --ok-l:#dff0e7; --warn:#c99a3e; --warn-l:#f8efd4; --err:#c0605a; --err-l:#f6e1df;
  --r:12px; --shadow:0 1px 2px rgba(36,59,58,.05),0 4px 14px rgba(36,59,58,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lcard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px;font-weight:650;font-size:17px;color:var(--teal-d)}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--teal);display:grid;place-items:center}
.logo i:after{content:"";width:12px;height:14px;border:2px solid #fff;border-radius:2px;border-top-width:4px}
.lcard p{color:var(--mute);margin:10px 0 22px}
label.f{display:block;font-size:12px;color:var(--mute);margin:0 0 5px}
input.t,select.t{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;background:#fff;outline:0}
input.t:focus,select.t:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l)}
.btn{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:550;transition:background .15s}
.btn:hover{background:var(--soft)}
.btn.p{background:var(--teal);border-color:var(--teal);color:#fff}.btn.p:hover{background:var(--teal-d)}
.btn.d{color:var(--err);border-color:#e6c4c1}.btn.d:hover{background:var(--err-l)}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:10px}
/* shell */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1280px;margin:auto;padding:12px 24px;display:flex;align-items:center;gap:22px}
nav{display:flex;gap:4px;margin-left:8px}
nav button{border:0;background:none;padding:8px 14px;border-radius:9px;cursor:pointer;color:var(--mute);font-weight:550}
nav button.on{background:var(--teal-l);color:var(--teal-d)}
.sp{flex:1}
main{max-width:1280px;margin:auto;padding:24px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:26px;font-weight:650;letter-spacing:-.5px}.tile span{color:var(--mute);font-size:12.5px}
.tile.warn b{color:var(--warn)}.tile.ok b{color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tools{display:flex;gap:8px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:5px 13px;cursor:pointer;color:var(--mute);font-size:13px}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);text-align:left;padding:10px 16px;font-weight:600;background:#fafbf9}
td{padding:12px 16px;border-top:1px solid var(--line)}
tbody tr.row{cursor:pointer}tbody tr.row:hover{background:#f8faf8}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.ready{background:var(--ok-l);color:#2d7456}.pill.review{background:var(--warn-l);color:var(--sand-d)}.pill.failed,.pill.rejected{background:var(--err-l);color:#9c423c}
.pill.approved{background:var(--teal-l);color:var(--teal-d)}
.meter{width:70px;height:6px;border-radius:9px;background:var(--line);display:inline-block;vertical-align:middle;margin-right:8px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px}
.src{color:var(--mute);font-size:12.5px}
.sub{color:var(--mute);font-size:12.5px}
.empty{padding:50px;text-align:center;color:var(--mute)}
/* drop zone */
#drop{border:1.5px dashed var(--line2);border-radius:var(--r);padding:16px;text-align:center;color:var(--mute);margin-bottom:18px;background:#fbfcfa;transition:.15s}
#drop.over{border-color:var(--teal);background:var(--teal-l);color:var(--teal-d)}
/* review */
.rv{display:grid;grid-template-columns:minmax(0,1fr) 470px;gap:20px;align-items:start}
.pane{padding:14px;background:#e9eee9;border-radius:var(--r);border:1px solid var(--line);position:sticky;top:78px;max-height:calc(100vh - 100px);overflow:auto}
.pane img{width:100%;display:block;border-radius:6px;box-shadow:0 2px 10px rgba(36,59,58,.15);background:#fff}
.pages{display:flex;gap:6px;margin-bottom:10px}
.side{display:flex;flex-direction:column;gap:14px}
.sec{padding:16px 18px}.sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld.low input{background:var(--sand-l);border-color:#e3cd8f}
.conf{font-size:11.5px;color:var(--faint);display:flex;justify-content:space-between;margin-top:3px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.chk{display:flex;gap:9px;padding:5px 0;align-items:flex-start;font-size:13px}
.chk i{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;margin-top:1px}
.chk i.ok{background:var(--ok-l);color:#2d7456}.chk i.no{background:var(--err-l);color:#9c423c}
.chk small{display:block;color:var(--mute)}
.items input{width:100%;padding:6px 7px;border:1px solid transparent;border-radius:7px;background:transparent;font-variant-numeric:tabular-nums}
.items input:hover{border-color:var(--line2)}.items input:focus{border-color:var(--teal);background:#fff;outline:0}
.items td,.items th{padding:3px 4px;border-top:0}.items th{background:none;padding-bottom:6px}
.items tr+tr td{border-top:1px solid var(--line)}
.x{border:0;background:none;color:var(--faint);cursor:pointer;font-size:16px}.x:hover{color:var(--err)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--mute);background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:6px}
.back{border:0;background:none;color:var(--teal-d);cursor:pointer;font-weight:600;padding:0;margin-bottom:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.hist{font-size:12.5px;color:var(--mute)}.hist div{padding:4px 0;border-top:1px solid var(--line)}.hist div:first-child{border-top:0}
.rc td.res{font-weight:600}
.res.match{color:var(--ok)}.res.mismatch{color:var(--err)}.res.missing,.res.unlisted{color:var(--sand-d)}
@media(max-width:1000px){.rv{grid-template-columns:1fr}.pane{position:static;max-height:none}.tiles{grid-template-columns:repeat(2,1fr)}.hm{display:none}}
</style>
</head>
<body>
<section id="login">
  <form class="lcard" id="lf">
    <div class="logo"><i></i>Document Desk</div>
    <p>Sign in to review incoming supplier documents.</p>
    <label class="f" for="pw">Password</label>
    <input class="t" id="pw" type="password" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="btn p" style="width:100%;margin-top:6px" id="lgo">Sign in</button>
  </form>
</section>

<div id="app" class="hide">
<header><div class="bar">
  <div class="logo"><i></i>Document Desk</div>
  <nav><button data-v="inbox" class="on">Inbox</button><button data-v="recon">Portal check</button></nav>
  <div class="sp"></div>
  <button class="btn" id="expcsv">Export CSV</button><button class="btn" id="expxlsx">Export Excel</button>
  <label class="btn p" style="margin:0">Upload<input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg" multiple hidden></label>
  <button class="btn" id="out">Sign out</button>
</div></header>
<main>
  <div id="v-inbox">
    <div class="tiles" id="tiles"></div>
    <div id="drop">Drop invoices here (PDF, PNG or JPG, up to 10 MB each), or use Upload</div>
    <div class="card">
      <div class="tools" id="chips"></div>
      <div id="list"></div>
    </div>
  </div>
  <div id="v-review" class="hide"></div>
  <div id="v-recon" class="hide"></div>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token="";try{token=localStorage.getItem("dd_token")||""}catch(e){}
let filter="",q="",cur=null,tm;
const SYM={USD:"$",GBP:"£",EUR:"€"};
const money=(v,c)=>v==null?"":(v<0?"-":"")+(SYM[c]||"")+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tm);tm=setTimeout(()=>t.classList.remove("on"),2600)};
async function api(p,o={}){
  const h={...(o.headers||{})};if(token)h.Authorization="Bearer "+token;
  if(o.json){h["Content-Type"]="application/json";o.body=JSON.stringify(o.json)}
  const r=await fetch("/api"+p,{...o,headers:h});
  if(r.status===401&&p!=="/admin/login"){signout();throw new Error("Signed out")}
  if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m}catch(e){}throw new Error(typeof m==="string"?m:"Request failed")}
  return r;
}
const J=async(p,o)=>(await api(p,o)).json();
function signout(){token="";try{localStorage.removeItem("dd_token")}catch(e){}$("#app").classList.add("hide");$("#login").classList.remove("hide")}
$("#lf").onsubmit=async e=>{e.preventDefault();$("#lerr").textContent="";
  try{const r=await J("/admin/login",{method:"POST",json:{password:$("#pw").value}});token=r.token;try{localStorage.setItem("dd_token",token)}catch(e){}start()}
  catch(x){$("#lerr").textContent=x.message}};
$("#out").onclick=signout;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));
function show(v){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  for(const x of["inbox","review","recon"])$("#v-"+x).classList.toggle("hide",x!==v);
  if(v==="inbox")loadInbox();if(v==="recon")loadRecon()}
async function start(){$("#login").classList.add("hide");$("#app").classList.remove("hide");show("inbox")}

/* ---------- inbox ---------- */
const CHIPS=[["","All"],["review","Needs review"],["ready","Ready"],["approved","Approved"],["rejected","Rejected"],["failed","Failed"]];
async function loadInbox(){
  const s=await J("/admin/stats");
  $("#tiles").innerHTML=[["Documents",s.documents,""],["Ready to approve",s.ready,"ok"],["Needs a look",s.review+s.failed,"warn"],["Approved value",money(s.approved_value,"USD"),""],["Read without help",s.straight_through+"%",""]]
    .map(t=>`<div class="tile ${t[2]}"><b>${esc(t[1])}</b><span>${t[0]}</span></div>`).join("");
  const p=new URLSearchParams();
  if(filter==="approved"||filter==="rejected")p.set("state",filter);else if(filter){p.set("status",filter);p.set("state","pending")}
  if(q)p.set("q",q);
  const d=await J("/admin/docs?"+p);
  $("#chips").innerHTML=CHIPS.map(c=>`<button class="chip ${filter===c[0]?"on":""}" data-f="${c[0]}">${c[1]}</button>`).join("")+`<div class="sp"></div><input class="t" style="max-width:240px" id="q" placeholder="Search supplier or number" value="${esc(q)}">`;
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.f;loadInbox()});
  $("#q").oninput=e=>{q=e.target.value;clearTimeout(tm);tm=setTimeout(async()=>{loadInbox();},250)};
  if(q)setTimeout(()=>{const i=$("#q");i&&(i.focus(),i.setSelectionRange(q.length,q.length))},0);
  if(!d.length){$("#list").innerHTML=`<div class="empty">Nothing here yet.</div>`;return}
  $("#list").innerHTML=`<table><thead><tr><th>Supplier</th><th>Number</th><th class="hm">Issued</th><th class="num">Total</th><th>Status</th><th class="hm">Confidence</th><th class="hm">Source</th></tr></thead><tbody>`+
   d.map(x=>{const st=x.state!=="pending"?x.state:x.status;const c=Math.round((x.overall||0)*100);const col=c>=78?"var(--ok)":c>=62?"var(--warn)":"var(--err)";
     return `<tr class="row" data-id="${x.id}"><td><b>${esc(x.supplier||"Unknown supplier")}</b><div class="sub">${esc(x.filename)}</div></td><td>${esc(x.invoice_no||"")}${x.kind==="credit_note"?' <span class="sub">(credit note)</span>':""}</td><td class="hm">${esc(x.issue_date||"")}</td>
     <td class="num"><b>${money(x.total,x.currency)}</b></td><td><span class="pill ${st}">${{ready:"Ready",review:"Needs review",failed:"Failed",approved:"Approved",rejected:"Rejected"}[st]}</span></td>
     <td class="hm"><span class="meter"><i style="width:${c}%;background:${col}"></i></span>${c}%</td><td class="hm src">${esc(x.source)}</td></tr>`}).join("")+`</tbody></table>`;
  document.querySelectorAll("tr.row").forEach(r=>r.onclick=()=>openDoc(+r.dataset.id));
}
async function upload(files){
  for(const f of files){const fd=new FormData();fd.append("file",f);
    try{const r=await api("/admin/upload",{method:"POST",body:fd});const j=await r.json();toast(j.duplicate?`${f.name}: already received`:`${f.name}: ${j.status}`)}catch(e){toast(`${f.name}: ${e.message}`)}}
  loadInbox()}
$("#file").onchange=e=>{upload([...e.target.files]);e.target.value=""};
const dz=$("#drop");["dragover","dragenter"].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add("over")}));
["dragleave","drop"].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove("over")}));
dz.addEventListener("drop",e=>upload([...e.dataTransfer.files]));
async function download(path,name){try{const r=await api(path);const b=await r.blob();const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click()}catch(e){toast(e.message)}}
$("#expcsv").onclick=()=>download("/admin/export.csv?state=approved","approved_documents.csv");
$("#expxlsx").onclick=()=>download("/admin/export.xlsx?state=approved","approved_documents.xlsx");

/* ---------- review ---------- */
const FIELDS=[["supplier","Supplier","text",2],["invoice_no","Invoice number","text",1],["po","PO number","text",1],["issue_date","Issue date","date",1],["due_date","Due date","date",1],["currency","Currency","cur",1],["kind","Type","kind",1],["subtotal","Subtotal","num",1],["tax","Tax","num",1],["total","Total","num",1]];
function confDot(c){const col=c>=.78?"var(--ok)":c>=.62?"var(--warn)":"var(--err)";return `<span class="dot" style="background:${col}"></span>`}
async function openDoc(id){
  cur=await J("/admin/docs/"+id);const d=cur.doc;const dec=d.state!=="pending";
  show("review");document.querySelectorAll("nav button").forEach(b=>b.classList.remove("on"));
  const pages=Array.from({length:d.pages||1},(_,i)=>i+1);
  const fld=([k,l,t,span])=>{const v=d[k]??"";const c=d.conf[k];const low=d.low.includes(k)||(d[k]==null&&["supplier","invoice_no","issue_date","total"].includes(k));
    let inp;if(t==="cur")inp=`<select class="t" data-k="${k}">${["","USD","GBP","EUR"].map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`;
    else if(t==="kind")inp=`<select class="t" data-k="${k}">${[["invoice","Invoice"],["credit_note","Credit note"]].map(o=>`<option value="${o[0]}" ${o[0]===v?"selected":""}>${o[1]}</option>`).join("")}</select>`;
    else inp=`<input class="t" data-k="${k}" data-t="${t}" value="${esc(v)}" ${t==="date"?'placeholder="YYYY-MM-DD"':""}>`;
    return `<div class="fld ${low?"low":""}" style="grid-column:span ${span}"><label class="f">${l}</label>${inp}<div class="conf"><span>${c!=null&&v!==""?confDot(c)+Math.round(c*100)+"% sure":"not found"}</span><span>${esc(d.how[k]||"")}</span></div></div>`};
  const chk=d.checks.map(c=>`<div class="chk"><i class="${c.ok?"ok":"no"}">${c.ok?"&#10003;":"&#10005;"}</i><div>${esc(c.name)}${c.detail&&!c.ok?`<small>${esc(c.detail)}</small>`:""}</div></div>`).join("");
  $("#v-review").innerHTML=`<button class="back" id="bk">&larr; Back to inbox</button>
  <div class="rv"><div class="pane"><div class="pages">${pages.length>1?pages.map(p=>`<button class="chip ${p===1?"on":""}" data-p="${p}">Page ${p}</button>`).join(""):""}</div><img id="pv" alt="Document" src=""></div>
  <div class="side">
   <div class="card sec"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">${esc(d.filename)}</h3><span class="pill ${dec?d.state:d.status}">${dec?d.state:{ready:"Ready",review:"Needs review",failed:"Failed"}[d.status]}</span></div>
     <div class="grid2" id="ff">${FIELDS.map(fld).join("")}</div></div>
   <div class="card sec"><h3>Line items</h3><table class="items" id="it"><thead><tr><th>Description</th><th style="width:52px">Qty</th><th style="width:84px">Unit</th><th style="width:92px">Amount</th><th style="width:22px"></th></tr></thead><tbody>${cur.items.map(itemRow).join("")}</tbody></table>
     <button class="btn" style="margin-top:8px" id="addi" ${dec?"disabled":""}>Add a line</button></div>
   <div class="card sec"><h3>Checks</h3>${chk||'<span class="sub">No checks ran.</span>'}${d.notes.length?`<div class="note">${d.notes.map(esc).join("<br>")}</div>`:""}</div>
   <div class="card sec"><input class="t" id="rnote" placeholder="Note (optional, saved when you reject)" style="margin-bottom:10px" ${dec?"disabled":""}><div class="acts"><button class="btn" id="save" ${dec?"disabled":""}>Save corrections</button><button class="btn p" id="ok" ${dec?"disabled":""}>Approve</button><button class="btn d" id="no" ${dec?"disabled":""}>Reject</button></div>
     <div class="err" id="rerr"></div></div>
   <div class="card sec"><h3>History</h3><div class="hist">${cur.activity.map(a=>`<div>${esc(a.text)} <span style="float:right">${esc((a.ts||"").replace("T"," ").slice(0,16))}</span></div>`).join("")}</div></div>
  </div></div>`;
  $("#bk").onclick=()=>show("inbox");
  const load=p=>{$("#pv").src="";api(`/admin/docs/${id}/preview/${p}`).then(r=>r.blob()).then(b=>{$("#pv").src=URL.createObjectURL(b)})};load(1);
  document.querySelectorAll(".pages .chip").forEach(b=>b.onclick=()=>{document.querySelectorAll(".pages .chip").forEach(x=>x.classList.toggle("on",x===b));load(+b.dataset.p)});
  $("#addi").onclick=()=>$("#it tbody").insertAdjacentHTML("beforeend",itemRow({description:"",qty:"",unit_price:"",amount:""}));
  $("#it").onclick=e=>{if(e.target.classList.contains("x"))e.target.closest("tr").remove()};
  const body=()=>{const f={};document.querySelectorAll("#ff [data-k]").forEach(i=>{let v=i.value.trim();f[i.dataset.k]=v===""?null:v});
    const items=[...document.querySelectorAll("#it tbody tr")].map(r=>{const v=[...r.querySelectorAll("input")].map(i=>i.value.trim());return{description:v[0],qty:v[1]===""?null:+v[1],unit_price:v[2]===""?null:+v[2],amount:+v[3]}}).filter(i=>i.description||i.amount);
    return{fields:f,items}};
  const save=async()=>{await api(`/admin/docs/${id}`,{method:"PATCH",json:body()})};
  $("#save").onclick=async()=>{try{await save();toast("Corrections saved");openDoc(id)}catch(e){$("#rerr").textContent=e.message}};
  $("#ok").onclick=async()=>{try{await save();await api(`/admin/docs/${id}/approve`,{method:"POST",json:{}});toast("Approved");show("inbox")}catch(e){$("#rerr").textContent=e.message}};
  $("#no").onclick=async()=>{const n=($("#rnote").value||"").trim();try{await api(`/admin/docs/${id}/reject`,{method:"POST",json:{note:n}});toast("Rejected");show("inbox")}catch(e){$("#rerr").textContent=e.message}};
}
function itemRow(i){const a=(v,w)=>`<td><input value="${esc(v??"")}" ${w||""}></td>`;return `<tr>${a(i.description)}${a(i.qty,'style="text-align:right"')}${a(i.unit_price,'style="text-align:right"')}${a(i.amount,'style="text-align:right"')}<td><button class="x" title="Remove">&times;</button></td></tr>`}

/* ---------- portal check ---------- */
async function loadRecon(){
  const r=await J("/admin/reconcile");const c=r.counts;
  $("#v-recon").innerHTML=`<div class="tiles" style="grid-template-columns:repeat(4,1fr)"><div class="tile ok"><b>${c.match}</b><span>Amounts agree</span></div><div class="tile warn"><b>${c.mismatch}</b><span>Amount differs</span></div><div class="tile warn"><b>${c.missing}</b><span>No document received</span></div><div class="tile"><b>${c.unlisted}</b><span>Not on the statement</span></div></div>
  <div class="card">${r.rows.length?`<table class="rc"><thead><tr><th>Statement ref</th><th>Supplier</th><th>Invoice</th><th class="num">Statement</th><th class="num">Extracted</th><th>Result</th></tr></thead><tbody>${r.rows.map(x=>`<tr ${x.doc?`class="row" data-id="${x.doc}"`:""}><td>${esc(x.ref||"")}</td><td>${esc(x.supplier)}</td><td>${esc(x.invoice_no)}</td><td class="num">${x.amount==null?"":x.amount.toFixed(2)}</td><td class="num">${x.extracted==null?"":x.extracted.toFixed(2)}</td><td class="res ${x.result}">${{match:"Match",mismatch:"Mismatch",missing:"Missing",unlisted:"Not listed"}[x.result]}<div class="sub" style="font-weight:400">${esc(x.why)}</div></td></tr>`).join("")}</tbody></table>`:'<div class="empty">No portal statement has been collected yet. Run the portal bot.</div>'}</div>`;
  document.querySelectorAll("#v-recon tr.row").forEach(t=>t.onclick=()=>openDoc(+t.dataset.id));
}
if(token)J("/admin/stats").then(start).catch(()=>{});
</script>
</body>
</html>
